{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GenAI Chat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">
      <i class="bi bi-robot"></i> GenAI Chat
    </span>
    <div class="d-flex gap-2">
      <select id="modelSelect" class="form-select form-select-sm" style="width: auto;">
        <option value="fast" selected>qwen2.5:1.5b (fast)</option>
        <option value="main">llama3.2:1b (main)</option>
      </select>
      <button id="clearBtn" class="btn btn-outline-light btn-sm">
        <i class="bi bi-trash"></i> Clear
      </button>
    </div>
  </div>
</nav>

<div class="container" style="max-width: 860px;">
  <div id="chatBox" class="chat-box mb-3">
    <div class="welcome text-center text-muted py-5">
      <i class="bi bi-chat-dots display-4"></i>
      <p class="mt-2 mb-0">Ask anything to get started.</p>
    </div>
  </div>

  <form id="chatForm" class="input-group mb-4">
    <button class="btn btn-secondary" type="button" id="uploadBtn"
            title="Upload a PDF or TXT document" aria-label="Upload document">
      <i class="bi bi-paperclip"></i>
    </button>
    <textarea
      id="userInput"
      class="form-control"
      rows="1"
      placeholder="Ask anything... (Enter = send, Shift+Enter = newline)"
      required></textarea>
    <button class="btn btn-primary" type="submit" id="sendBtn">
      <i class="bi bi-send"></i>
    </button>
  </form>

  <!-- Kept outside the input-group so Bootstrap's rounded corners stay intact -->
  <input type="file" id="fileUpload" accept=".pdf,.txt" hidden />
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="{% static 'app.js' %}"></script>
</body>
</html>
