{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GenAI Chat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'web_ui/style.css' %}" />
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">
      <i class="bi bi-robot"></i> GenAI Chat
    </span>
    <div class="d-flex gap-2 align-items-center">
      <span class="text-light me-2" id="navUsername"></span>
      <select id="modelSelect" class="form-select form-select-sm" style="width: auto;">
        <option value="fast" selected>qwen2.5:1.5b (fast)</option>
        <option value="main">llama3.2:1b (main)</option>
      </select>
      <button id="clearBtn" class="btn btn-outline-light btn-sm">
        <i class="bi bi-trash"></i> Clear
      </button>
      <button id="logoutBtn" class="btn btn-danger btn-sm">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>
</nav>

<!-- Main Layout with Sidebar -->
<div class="d-flex" style="height: calc(100vh - 56px);">

    <!-- Sidebar for History -->
    <div class="bg-dark text-white p-3 d-flex flex-column" style="width: 280px;">
        <button id="newChatBtn" class="btn btn-outline-light w-100 mb-3">
            <i class="bi bi-plus-lg"></i> New Chat
        </button>
        <h6 class="text-uppercase text-muted mb-3">Recent Chats</h6>
        <div id="historyList" class="list-group overflow-y-auto flex-grow-1">
            <!-- History items will be loaded here by JS -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="container flex-grow-1 d-flex flex-column" style="max-width: 860px; overflow-y: auto;">
        <div id="chatBox" class="chat-box mb-3 flex-grow-1">
            <div class="welcome text-center text-muted py-5">
                <i class="bi bi-chat-dots display-4"></i>
                <p class="mt-2 mb-0">Ask anything to get started.</p>
            </div>
        </div>

        <form id="chatForm" class="input-group mb-4">
            <button class="btn btn-secondary" type="button" id="uploadBtn"
                    title="Upload a PDF or TXT document" aria-label="Upload document">
                <i class="bi bi-paperclip"></i>
            </button>
            <textarea
                id="userInput"
                class="form-control"
                rows="1"
                placeholder="Ask anything... (Enter = send, Shift+Enter = newline)"
                required></textarea>
            <button class="btn btn-primary" type="submit" id="sendBtn">
                <i class="bi bi-send"></i>
            </button>
        </form>

        <input type="file" id="fileUpload" accept=".pdf,.txt" hidden />
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="{% static 'web_ui/app.js' %}"></script>
</body>
</html>
