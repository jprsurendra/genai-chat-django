{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - GenAI Chat</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'web_ui/favicon.svg' %}" />
    <link href="{% static 'vendor/bootstrap-5.3.9/css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'web_ui/login.css' %}" rel="stylesheet" />
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container login-container">
        <div class="card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">GenAI Login</h3>

                <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Register</button>
                    </li>
                </ul>

                <div class="tab-content" id="authTabsContent">
                    <!-- Login Form -->
                    <div class="tab-pane fade show active" id="login" role="tabpanel">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" id="loginUsername" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" id="loginPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                            <div id="loginError" class="text-danger mt-2 text-center"></div>
                        </form>
                    </div>

                    <!-- Register Form (Updated) -->
                    <div class="tab-pane fade" id="register" role="tabpanel">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" id="regUsername" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" id="regEmail" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" id="regPassword" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Confirm Password</label>
                                <input type="password" id="regConfirmPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Register</button>
                            <div id="regError" class="text-danger mt-2 text-center"></div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="{% static 'vendor/bootstrap-5.3.9/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'web_ui/login.js' %}"></script>
</body>
</html>
